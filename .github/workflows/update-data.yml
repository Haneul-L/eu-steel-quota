name: Update TARIC data

on:
  schedule:
    # every 2 hours, 06:00–18:00 Istanbul (UTC+3), Monday–Friday
    - cron: "0 3-15/2 * * 1-5"
  workflow_dispatch: {}      # "Run workflow" button for a manual update

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch TARIC
        run: python scripts/fetch_taric.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "Update TARIC data"
          git push
